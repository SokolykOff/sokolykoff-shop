name: PostgreSQL CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sokolykoff
          POSTGRES_USER: sokolykoff
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sokolykoff -d sokolykoff"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: sokolykoff
      POSTGRES_USER: sokolykoff
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      CELERY_TASK_ALWAYS_EAGER: "True"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lock.txt
      - run: pip check
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py loaddata fixtures.json
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test --noinput

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure local demo
        run: cp backend/.env.example backend/.env
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Load demo data
        run: docker compose exec -T web python manage.py loaddata fixtures.json
      - name: HTTP and worker smoke tests
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/api/health/
          curl --fail http://127.0.0.1:8000/api/catalog/ > /dev/null
          curl --fail http://127.0.0.1:8000/static/shop/shop.css > /dev/null
          docker compose exec -T web python manage.py shell -c "from orders.tasks import process_order_payment_task; r = process_order_payment_task.delay(-1, 'demo'); assert r.get(timeout=60)['status'] == 'error'; print('Redis/Celery round trip OK')"
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
