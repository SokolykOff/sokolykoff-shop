<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc">
<title id="title">SokolykOff Shop — architecture</title>
<desc id="desc">Browser communicates with Django through Gunicorn. Django queries PostgreSQL, publishes Celery tasks to Redis and optionally calls an external LLM. Celery consumes Redis tasks, updates PostgreSQL and stores results in Redis.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1120" height="800" rx="20" fill="#f8fafc"/>
<style>text{font-family:DejaVu Sans,Arial,sans-serif} .title{font-size:28px;font-weight:700;fill:#0f172a}.name{font-size:19px;font-weight:700;fill:#0f172a}.detail{font-size:14px;fill:#475569}.label{font-size:13px;fill:#475569}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="45" y="51" class="title">SokolykOff Shop</text><text x="45" y="79" class="detail">Django · PostgreSQL · Celery · Redis</text>
<rect x="375" y="115" width="310" height="85" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="400" y="148" class="name">Browser / Vue 3</text><text x="400" y="177" class="detail">Django templates + fetch API</text>
