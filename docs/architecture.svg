<rect x="345" y="280" width="370" height="140" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
<text x="370" y="315" class="name">Gunicorn → Django</text><text x="370" y="345" class="detail">Catalog · Users · Orders · AI service</text><text x="370" y="371" class="detail">Transactions + select_for_update()</text><text x="370" y="397" class="detail">WhiteNoise: collected static files</text>
<rect x="800" y="280" width="270" height="140" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="822" y="315" class="name">External LLM API</text><text x="822" y="345" class="detail">Optional HTTP integration</text><text x="822" y="371" class="detail">Local fallback runs in Django</text><text x="822" y="397" class="detail">No API key required for demo</text>
<path d="M715 331 H800" class="edge"/><text x="729" y="318" class="label">HTTPS</text>
<rect x="45" y="520" width="300" height="135" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
<text x="68" y="555" class="name">PostgreSQL 17</text><text x="68" y="585" class="detail">Products · Orders · Users · Sessions</text><text x="68" y="611" class="detail">Row locks · CHECK / UNIQUE</text><text x="68" y="637" class="detail">Persistent postgres_data volume</text>
<rect x="420" y="520" width="270" height="135" rx="12" fill="#fff7ed" stroke="#fb923c"/>
<text x="444" y="555" class="name">Redis</text><text x="444" y="585" class="detail">Celery broker + result backend</text><text x="444" y="611" class="detail">Task messages / results</text>
<rect x="800" y="520" width="270" height="135" rx="12" fill="#f0fdf4" stroke="#4ade80"/>
