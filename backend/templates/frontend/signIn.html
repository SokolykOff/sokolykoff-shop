{% extends "frontend/base.html" %}
{% load static %}

{% block content %}
<div class="Auth">
    <div class="wrapper">
        <h3 class="sign-in">Вход</h3>
        <form @submit.prevent="signIn()">
            <input class="user-input" type="text" name="login" id="login" placeholder="Логин"/>
            <input type="password" name="password" id="password" placeholder="Пароль"/>
            <input type="submit" value="Войти"/>
            <a class="sub-link" href="/sign-up">Регистрация</a>
        </form>
    </div>
</div>
{% endblock %}

{% block mixins %}
<script src="{% static 'frontend/assets/js/signIn.js' %}"></script>
<script>
mix.methods.signIn = function() {
  const username = document.querySelector('#login').value.trim();
  const password = document.querySelector('#password').value.trim();
  if (!username || !password) {
    alert('Пожалуйста, введите логин и пароль');
    return;
  }
  this.postData('/api/sign-in/', JSON.stringify({ username, password }))
    .then(() => { location.assign('/'); })
    .catch(() => { alert('Ошибка входа: неверный логин или пароль (либо такого пользователя не существует)!'); });
};
</script>
{% endblock %}
